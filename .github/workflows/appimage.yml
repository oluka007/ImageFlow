name: AppImage

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            desktop-file-utils \
            gettext \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            libadwaita-1-dev \
            libgtk-4-dev \
            meson \
            ninja-build \
            pipx \
            python3-gi
      - name: Install AppImage Builder
        run: |
          pipx install appimage-builder
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build AppImage
        run: packaging/build-appimage.sh
      - name: Publish AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: ImageFlow-*-x86_64.AppImage
